server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Use the full standard MIME map (html, css, js, svg, png, wasm, …). Defining a bare
  # `types {}` block here would REPLACE this map and, missing text/html, make the browser
  # download index.html instead of rendering it.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The web app manifest isn't in the default map.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript text/javascript application/wasm application/json image/svg+xml;
  gzip_min_length 1024;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
